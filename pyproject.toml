[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cnlc-agentscope"
version = "0.1.0"
description = "A workflow-driven well interpretation agent skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentscope[service,storage-redis]==2.0.8",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "h5py>=3.11,<4",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "redis>=5,<7",
    "requests>=2.32,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.scripts]
cnlc-agent = "cnlc_agent.main:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "mypy>=1.16,<2",
    "fakeredis>=2.30,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cnlc_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/cnlc_agent"]
